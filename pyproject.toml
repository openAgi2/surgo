[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surgo"
dynamic = ["version"]
description = "Open-source A-share multi-agent LLM research framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "surgo contributors"},
]
keywords = ["a-share", "llm", "multi-agent", "trading", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Dependencies track the vendored upstream engine (tradingagents/), plus the
# A-share data adapters (tushare/akshare/baostock) for the ashare vendor; see
# docs/porting-plan.md.
dependencies = [
    "akshare>=1.19.0",
    "baostock>=0.9.0",
    "langchain-core>=1.6.5",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "tushare>=1.4.0",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "surgo[bedrock]".
bedrock = [
    "langchain-aws>=1.7.9",
]

[project.urls]
Homepage = "https://github.com/openAgi2/surgo"
Repository = "https://github.com/openAgi2/surgo"
Issues = "https://github.com/openAgi2/surgo/issues"

[project.scripts]
surgo = "cli.main:app"
surgo-web = "web.run_web:main"

[tool.setuptools.dynamic]
version = {attr = "tradingagents.__version__"}

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "web*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services; run only when asked for, with -m integration",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
combine-as-imports = true
